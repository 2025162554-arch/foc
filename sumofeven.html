<section>
<h2>Sum of even numbers.</h2>

<p>Enter a number.</p>
<input type="number" id="num1">
<button onclick="add()">=</button>

<p>Sum of all even numbers of your given number is: </p>
<h2 id="result"></h2>
<script>
function add(){
let n = +num1.value;
let sum = 0;
let n1 = 2;

while(n1 <= n){
sum += n1;
n1 += 2;
}
let resultElement = document.getElementById('result');
resultElement.textContent = sum;
}
</script>
